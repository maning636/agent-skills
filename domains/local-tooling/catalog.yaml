  name: 本地离线 OCR 识文
  path: domains/local-tooling/local-ocr/SKILL.md
  version: 1.0.0
  domain: local-tooling
  description: Extract text from local images (PNG, JPEG) with precise coordinates, confidence scores,
    and stable error handling using the light-ocr CLI. Use when needing to read small/dense text in screenshots,
    receipts, labels, forms, or documents that a multimodal model may misread; when exact text plus bounding
    box coordinates are needed for field extraction, redaction, counting, or layout analysis; or when
    deterministic offline OCR is required without network or API calls.
