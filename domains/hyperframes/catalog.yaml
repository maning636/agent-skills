  name: HyperFrames 动效引擎
  path: domains/hyperframes/hyperframes/SKILL.md
  version: 1.0.0
  domain: hyperframes
  description: Create video compositions, animations, title cards, overlays, captions, voiceovers, audio-reactive
    visuals, and scene transitions in HyperFrames HTML. Use when asked to build any HTML-based video content,
    add captions or subtitles synced to audio, generate text-to-speech narration, create audio-reactive
    animation (beat sync, glow, pulse driven by music), add animated text highlighting (marker sweeps,
    hand-drawn circles, burst lines, scribble, sketchout), or add transitions between scenes (crossfades,
    wipes, reveals, shader transitions). Covers composition authoring, timing, media, and the full video
    production workflow. For dev-loop CLI commands (init, lint, inspect, preview, render) see the hyperframes-cli
    skill; for asset preprocessing commands (tts, transcribe, remove-background) see the hyperframes-media
    skill.
